<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#253a7d" />
    <title>Offline | Natural Disaster Alert System</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #0f1f4a, #253a7d 45%, #4d4db0);
        color: #fff;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 12px;
        max-width: 560px;
        width: 100%;
        padding: 24px;
      }
      h1 {
        margin-top: 0;
      }
      p {
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>Natural Disaster Alert System is currently offline.</p>
      <p>Previously loaded pages remain available. Reconnect to sync alerts and live updates.</p>
    </main>
  </body>
</html>
